[project]
name = "aml-graphrag"
version = "0.1.0"
description = "GraphRAG for anti-money laundering analysts: answers grounded in a transaction graph and a knowledge graph"
readme = "README.md"
authors = [
    { name = "Juan Diego", email = "gaova777@utp.edu.co" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.149.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "python-igraph>=1.0.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
gnn = [
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "torch-geometric>=2.8.1",
]
mlops = [
    "langfuse>=5.0.2",
]
