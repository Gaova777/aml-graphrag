[project]
name = "aml-graphrag"
version = "0.1.0"
description = "GraphRAG for anti-money laundering analysts: answers grounded in a transaction graph and a knowledge graph"
readme = "README.md"
authors = [
    { name = "Juan Diego", email = "gaova777@utp.edu.co" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "python-igraph>=1.0.0",
    "tiktoken>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
